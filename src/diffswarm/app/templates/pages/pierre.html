{% extends "base.html" %}
{% block title %}{{ diff.name or "diffswarm" }}{% endblock %}
{% block scripts %}
  <script type="importmap">
    {
      "imports": {
        "@pierre/diffs": "https://esm.sh/@pierre/diffs@1.5.1?bundle&target=es2022",
        "@pierre/diffs/worker": "https://esm.sh/@pierre/diffs@1.5.1/worker?bundle&target=es2022"
      }
    }
  </script>
{% endblock %}
{% block content %}
  <main class="pierre-page">
    <header class="pierre-toolbar">
      <div>
        <h1>{{ diff.name or diff.id_ }}</h1>
        <p>Experimental Pierre viewer</p>
      </div>
      <div class="pierre-controls">
        <label for="pierre-layout">Layout</label>
        <select id="pierre-layout" disabled>
          <option value="unified">Unified</option>
          <option value="split">Split</option>
        </select>
        <a href="{{ normal_view_url }}">Open normal viewer</a>
      </div>
    </header>
    <p id="pierre-status" role="status">Loading diff…</p>
    <div
      id="pierre-viewer"
      aria-label="Diff viewer"
      tabindex="0"
      data-diff-id="{{ diff.id_ }}"
      data-patch="{{ diff.raw }}"
    ></div>
    <noscript>Enable JavaScript to view this diff.</noscript>
  </main>
  <script src="/static/js/pierre.js?v={{ git_hash }}" type="module"></script>
{% endblock %}
{% block styles %}
  <style>
    .pierre-page {
      margin: 1rem;
      color: hsl(var(--foreground));
      background: hsl(var(--background));
      border: 1px solid hsl(var(--border));
      border-radius: 0.75rem;
      overflow: hidden;
    }
    .pierre-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem;
      border-bottom: 1px solid hsl(var(--border));
    }
    .pierre-toolbar h1 {
      font-weight: 600;
      overflow-wrap: anywhere;
    }
    .pierre-toolbar p {
      font-size: 0.8rem;
      opacity: 0.65;
    }
    .pierre-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.875rem;
    }
    .pierre-controls select {
      padding: 0.25rem;
      background: hsl(var(--background));
      border: 1px solid hsl(var(--border));
      border-radius: 0.25rem;
    }
    .pierre-controls a {
      text-decoration: underline;
    }
    #pierre-status {
      padding: 1rem;
    }
    #pierre-viewer {
      height: calc(100dvh - 12rem);
      min-height: 24rem;
      overflow: auto;
      --diffs-font-family: "JetBrains Mono", monospace;
    }
  </style>
{% endblock %}
